# Dell iDRAC Redfish API - Complete Tools Reference
#
# This file contains ALL operations available in the OpenAPI specification.
# All tools are disabled by default (enabled: false).
#
# To use a tool:
#   1. Copy the tool definition to config/tools.yaml
#   2. Set 'enabled: true'
#   3. Adjust parameter mappings as needed
#
# Total operations: 671
#
# Operations by category:
#   - system_management: 135 (System and Computer Management Operations)
#   - bios_configuration: 12 (BIOS Configuration and Settings)
#   - hardware_inventory: 31 (Hardware Inventory (Memory, Processors, etc.))
#   - network_configuration: 29 (Network and Ethernet Interface Configuration)
#   - storage_management: 15 (Storage Controllers and Drives)
#   - power_thermal: 30 (Power and Thermal Management)
#   - manager_operations: 107 (iDRAC Manager Operations)
#   - chassis_management: 81 (Chassis and Physical Components)
#   - account_management: 21 (User Account Management)
#   - session_management: 6 (Session Management)
#   - security: 82 (Security and Certificates)
#   - logging: 24 (Event Logs and Log Services)
#   - firmware_update: 15 (Firmware Updates and Inventory)
#   - task_management: 23 (Task and Job Management)
#   - virtual_media: 1 (Virtual Media Operations)
#   - other: 59 (Other Operations)
#

version: '1.0'

server:
  base_url: https://idrac_ip
  verify_ssl: true
  timeout: 30
  max_retries: 3

authentication:

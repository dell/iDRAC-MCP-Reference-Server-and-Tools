[pytest]
# Pytest configuration for agentic integration tests

# Minimum pytest version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default test paths
testpaths = scenarios

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    agentic: Agentic integration test
    smoke: Critical smoke test (must pass)
    tier1: Tier 1 - Fast tests with local models
    tier2: Tier 2 - Thorough tests with cloud models
    tier3: Tier 3 - Acceptance tests with best models
    workflow: Multi-step workflow test
    mock_only: Only run in mock mode
    live_only: Only run in live mode

# Timeout
timeout = 120

# Logging
log_cli = false
log_cli_level = INFO
log_file = test_run.log
log_file_level = DEBUG

# Coverage (optional)
# Uncomment to enable coverage tracking
# addopts = --cov=utils --cov-report=html --cov-report=term
